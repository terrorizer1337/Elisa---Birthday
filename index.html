<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Elisa Turns 25 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #fde2e4, #e0c3fc);
      color: #333;
      overflow: hidden;
    }

    .page {
      display: none;
      height: 100vh;
      width: 100vw;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
    }

    .page.active {
      display: flex;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 26px;
      font-size: 1rem;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      margin: 10px;
      background: #ffafcc;
      color: #fff;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .floating {
      position: absolute;
    }

    /* Page 1 */
    .flowers {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    /* Page 2 */
    img {
      max-width: 300px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    /* Page 3 */
    .final {
      font-size: 2.5rem;
    }

    .message {
      font-size: 1.3rem;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <div class="flowers">🌸 💕 🌸</div>
    <h1>Is it a cutie’s birthday?<br>Is she turning 25? 🎂</h1>

    <div>
      <button onclick="goToPage(2)">YES 💖</button>
      <button id="noBtn">NO 😈</button>
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2">
    <img src="https://i.imgur.com/1KegWPz.jpg" alt="Leo Meme" />
    <h1>Don’t turn 25.<br>You are so sexy 😎</h1>
    <button id="shutBtn">Shut Up, I am 25!</button>
  </div>

  <!-- PAGE 3 -->
  <div class="page" id="page3">
    <div class="final">🎉 Happy 25th Birthday Elisa 💖</div>
    <div class="message">Happy Birthday Cutie!<br>I love You 💕</div>
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" />
  </div>

  <script>
    function goToPage(page) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById("page" + page).classList.add("active");
    }

    // NO button flies away
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 150);
      const y = Math.random() * (window.innerHeight - 60);
      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });

    // Shut Up button dodges but eventually allows click
    const shutBtn = document.getElementById("shutBtn");
    let tries = 0;

    shutBtn.addEventListener("mouseover", () => {
      if (tries < 3) {
        const x = Math.random() * (window.innerWidth - 200);
        const y = Math.random() * (window.innerHeight - 100);
        shutBtn.style.position = "absolute";
        shutBtn.style.left = x + "px";
        shutBtn.style.top = y + "px";
        tries++;
      }
    });

    shutBtn.addEventListener("click", () => {
      goToPage(3);
    });
  </script>

</body>
</html>
