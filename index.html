<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Elisa Turns 25 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: "Comic Sans MS", "Poppins", sans-serif;
      background: linear-gradient(135deg, #ffd6e8, #dbeafe);
      color: #444;
      overflow: hidden;
    }

    .page {
      display: none;
      height: 100vh;
      width: 100vw;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      position: absolute;
      top: 0;
      left: 0;
      padding: 20px;
    }

    .page.active {
      display: flex;
    }

    h1 {
      font-size: 2.2rem;
      margin: 15px 0;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      margin: 10px;
      background: #ffb3d9;
      color: #fff;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    /* DEFAULT IMAGE STYLING */
    img {
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      margin-top: 15px;
    }

    /* BIG LEO IMAGE (PAGE 2 ONLY) */
    #page2 img {
      max-width: 90vw;
      max-height: 65vh;
    }

    .decor {
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    .final {
      font-size: 2.5rem;
      color: #ff69b4;
    }

    .message {
      font-size: 1.4rem;
      margin-top: 15px;
    }

    /* FLOATING SANRIO VIBES */
    .float {
      position: absolute;
      animation: floatUp 8s linear infinite;
      opacity: 0.7;
      font-size: 1.5rem;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
      }
      to {
        transform: translateY(-10vh);
      }
    }
  </style>
</head>

<body>

  <!-- FLOATING DECORATIONS -->
  <script>
    const icons = ["💖","⭐","🎀","💗","🌸"];
    for (let i = 0; i < 20; i++) {
      const span = document.createElement("span");
      span.className = "float";
      span.innerText = icons[Math.floor(Math.random() * icons.length)];
      span.style.left = Math.random() * 100 + "vw";
      span.style.animationDuration = (6 + Math.random() * 6) + "s";
      document.body.appendChild(span);
    }
  </script>

  <!-- PAGE 1 -->
  <div class="page active" id="page1">
    <div class="decor">🌸 🎀 💕 🌸</div>
    <h1>Is it a cutie’s birthday?<br>Is she turning 25? 🎂</h1>

    <div>
      <button onclick="goToPage(2)">YES 💖</button>
      <button id="noBtn">NO 😈</button>
    </div>
  </div>

  <!-- PAGE 2 -->
  <div class="page" id="page2">
    <img src="leo.png" alt="Leo Meme" />
    <h1>Nooo don’t turn 25,<br>you’re so sexy 😎</h1>
    <button id="shutBtn">Shut Up, I am 25!</button>
  </div>

  <!-- PAGE 3 -->
  <div class="page" id="page3">
    <div class="final">🎉 Happy 25th Birthday Elisa 💖</div>
    <div class="message">
      Happy Birthday Cutie!<br>I love You 💕
    </div>
<img src="/Elisa---Birthday/pochacco.gif" alt="Pochacco Birthday Gif" />
  </div>

  <script>
    function goToPage(page) {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById("page" + page).classList.add("active");
    }

    // NO button escapes
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      noBtn.style.position = "absolute";
      noBtn.style.left = Math.random() * (window.innerWidth - 150) + "px";
      noBtn.style.top = Math.random() * (window.innerHeight - 60) + "px";
    });

    // Shut Up button dodges a bit
    const shutBtn = document.getElementById("shutBtn");
    let tries = 0;

    shutBtn.addEventListener("mouseover", () => {
      if (tries < 3) {
        shutBtn.style.position = "absolute";
        shutBtn.style.left = Math.random() * (window.innerWidth - 200) + "px";
        shutBtn.style.top = Math.random() * (window.innerHeight - 100) + "px";
        tries++;
      }
    });

    shutBtn.addEventListener("click", () => {
      goToPage(3);
    });
  </script>

</body>
</html>
